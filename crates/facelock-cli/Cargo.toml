[package]
name = "facelock"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
facelock-core = { version = "0.1.0", path = "../facelock-core" }
futures-util = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["png"] }
nix = { version = "0.31.3", features = ["user"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal"] }
zbus = { version = "6.2.1", default-features = false, features = ["tokio", "proxy"] }
