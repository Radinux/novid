<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.facelock.Daemon1"/>
  </policy>
  <!-- Anyone may call; the daemon checks the caller's uid and polkit itself. -->
  <policy context="default">
    <allow send_destination="org.facelock.Daemon1" send_interface="org.facelock.Daemon1"/>
    <allow send_destination="org.facelock.Daemon1" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.facelock.Daemon1" send_interface="org.freedesktop.DBus.Properties" send_member="Get"/>
    <allow send_destination="org.facelock.Daemon1" send_interface="org.freedesktop.DBus.Properties" send_member="GetAll"/>
    <allow send_destination="org.facelock.Daemon1" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
